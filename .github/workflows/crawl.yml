name: Crawl addons

# Superseded: this Rails-based importer was replaced by the PHP rebuild
# and its crawler now lives at github.com/danoli3/ofxAddons, which runs
# on its own schedule and publishes to this org's Github Releases. This
# workflow targeted the abandoned Rails/DreamHost deploy and its SSH
# secrets were never configured, so it just failed on every scheduled
# run. Kept as workflow_dispatch only for manual/historical reference.

on:
  workflow_dispatch: {}

concurrency:
  group: ofxaddons-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Run importer over SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.CRAWL_SSH_HOST }}
          username: ${{ secrets.CRAWL_SSH_USER }}
          key: ${{ secrets.CRAWL_SSH_KEY }}
          port: ${{ secrets.CRAWL_SSH_PORT || 22 }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd "${{ secrets.CRAWL_APP_PATH }}"
            RAILS_ENV=production bundle exec rails runner 'Importer.new.run'
