name: Crawl addons

# Runs the importer on a schedule instead of relying on cron on the app
# server. Overlapping runs are prevented two ways: the concurrency group
# below stops two Actions runs from overlapping, and Importer#run itself
# takes a file lock (see lib/importer.rb) so a run that's still going when
# the next scheduled trigger fires is skipped rather than clobbered.
#
# Requires these repository secrets to be configured before this workflow
# does anything (until then it will just fail on the SSH step):
#   CRAWL_SSH_HOST  - hostname/IP of the box running the Rails app
#   CRAWL_SSH_USER  - SSH user (e.g. the capistrano deploy user)
#   CRAWL_SSH_KEY   - private key with access to that user, no passphrase
#   CRAWL_SSH_PORT  - (optional) SSH port, defaults to 22
#   CRAWL_APP_PATH  - path to the deployed app on the server
#                      (e.g. /home/deploy/ofxaddons.com/current)

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: ofxaddons-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Run importer over SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.CRAWL_SSH_HOST }}
          username: ${{ secrets.CRAWL_SSH_USER }}
          key: ${{ secrets.CRAWL_SSH_KEY }}
          port: ${{ secrets.CRAWL_SSH_PORT || 22 }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd "${{ secrets.CRAWL_APP_PATH }}"
            RAILS_ENV=production bundle exec rails runner 'Importer.new.run'
