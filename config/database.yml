default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: 5
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "ofxaddons") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "ofxaddons_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "ofxaddons") %>
